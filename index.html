<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FreshMindVideo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --fondo: #f3f6f8;
    --tarjeta: #ffffff;
    --texto: #1d2b3a;
    --acento: #12a37f;
    /* Proporción de la imagen de cada tarjeta. Cámbiala a 1 / 1 para cuadrados exactos. */
    --proporcion: 16 / 9;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: var(--texto); font-family: "Nunito", "Segoe UI", Arial, sans-serif; }
  header { position: sticky; top: 0; z-index: 10; background: var(--tarjeta); padding: 14px 24px; box-shadow: 0 1px 0 rgba(29, 43, 58, .12); }
  header h1 { margin: 0; font-size: 1.6rem; font-weight: 800; color: var(--acento); letter-spacing: -.01em; }
  main { max-width: 1000px; margin: 0 auto; padding: 28px 20px 48px; }
  .cuadricula { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
  .tarjeta {
    display: block; background: var(--tarjeta); border-radius: 10px; overflow: hidden;
    color: inherit; text-decoration: none; box-shadow: 0 1px 4px rgba(29, 43, 58, .14);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .tarjeta:hover { transform: translateY(-3px); box-shadow: 0 6px 14px rgba(29, 43, 58, .18); }
  .tarjeta:focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; }
  .media { aspect-ratio: var(--proporcion); background: #dfe6ea; }
  .media img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .inicial { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 3.2rem; font-weight: 800; color: rgba(29, 43, 58, .75); }
  .nombre { margin: 0; padding: 12px 14px 14px; font-size: 1rem; font-weight: 700; line-height: 1.3; }
  .mensaje { text-align: center; padding: 40px 16px; font-weight: 600; }

  /* Reproductor */
  dialog { width: min(920px, 96vw); padding: 0; border: 0; border-radius: 12px; overflow: hidden; background: #0f1720; color: #fff; }
  dialog::backdrop { background: rgba(10, 20, 30, .78); }
  .barra { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 8px 6px 16px; background: #1d2b3a; }
  .barra h2 { margin: 0; font-size: 1rem; font-weight: 700; }
  .reproductor { background: #000; }
  .reproductor:fullscreen { display: flex; flex-direction: column; }
  .reproductor:-webkit-full-screen { display: flex; flex-direction: column; }
  .video { position: relative; aspect-ratio: 16 / 9; width: 100%; background: #000; }
  .reproductor:fullscreen .video { flex: 1; aspect-ratio: auto; }
  .reproductor:-webkit-full-screen .video { flex: 1; aspect-ratio: auto; }
  .video iframe { width: 100%; height: 100%; border: 0; display: block; }
  .controles { display: flex; align-items: center; gap: 4px; padding: 6px 10px; background: #1d2b3a; }
  .controles button, .cerrar {
    min-width: 44px; min-height: 44px; border: 0; background: none; color: #fff; border-radius: 8px;
    cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; line-height: 1;
  }
  .controles button:hover, .cerrar:hover { background: rgba(255, 255, 255, .12); }
  .controles button:focus-visible, .cerrar:focus-visible, .controles input:focus-visible { outline: 3px solid var(--acento); }
  .controles svg { width: 24px; height: 24px; fill: currentColor; }
  .controles input[type=range] { flex: 1; min-width: 60px; accent-color: var(--acento); }
  .tiempo { min-width: 92px; text-align: center; font-size: .85rem; font-variant-numeric: tabular-nums; }

  @media (max-width: 760px) { .cuadricula { grid-template-columns: repeat(2, 1fr); gap: 14px; } }
  @media (max-width: 480px) { .tiempo { display: none; } }
  @media (max-width: 360px) { .cuadricula { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { .tarjeta { transition: none; } .tarjeta:hover { transform: none; } }
</style>
</head>
<body>
<header><h1>FreshMindVideo</h1></header>
<main>
  <div id="cuadricula" class="cuadricula"></div>
  <p id="mensaje" class="mensaje">Cargando…</p>
</main>

<dialog id="dialogo" aria-labelledby="titulo-video">
  <div class="barra">
    <h2 id="titulo-video"></h2>
    <button class="cerrar" id="cerrar" type="button" aria-label="Cerrar reproductor">×</button>
  </div>
  <div class="reproductor" id="reproductor">
    <div class="video"><div id="marco"></div></div>
    <div class="controles">
      <button type="button" id="b-anterior" aria-label="Video anterior"></button>
      <button type="button" id="b-play" aria-label="Reproducir o pausar"></button>
      <button type="button" id="b-siguiente" aria-label="Video siguiente"></button>
      <input type="range" id="rango" min="0" max="1000" value="0" aria-label="Avance del video">
      <span class="tiempo" id="tiempo">0:00 / 0:00</span>
      <button type="button" id="b-sonido" aria-label="Activar o quitar sonido"></button>
      <button type="button" id="b-pantalla" aria-label="Pantalla completa"></button>
    </div>
  </div>
</dialog>

<script>
  var COLORES = ["#ffd166", "#7bdff2", "#b2f7b8", "#ffb3c1", "#cdb4ff", "#ffc98b"];
  var ICONOS = {
    anterior: '<svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>',
    siguiente: '<svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>',
    play: '<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>',
    pausa: '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
    sonido: '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9zM16.5 12a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>',
    mudo: '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9z"/><path d="M15 9l6 6M21 9l-6 6" stroke="currentColor" stroke-width="2" fill="none"/></svg>',
    pantalla: '<svg viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4zM20 4v6h-2V6h-4V4zM4 20v-6h2v4h4v2zM20 20h-6v-2h4v-4h2z"/></svg>'
  };

  var dialogo = document.getElementById("dialogo");
  var reproductor = document.getElementById("reproductor");
  var bPlay = document.getElementById("b-play");
  var bSonido = document.getElementById("b-sonido");
  var rango = document.getElementById("rango");
  var tiempo = document.getElementById("tiempo");

  document.getElementById("b-anterior").innerHTML = ICONOS.anterior;
  document.getElementById("b-siguiente").innerHTML = ICONOS.siguiente;
  document.getElementById("b-pantalla").innerHTML = ICONOS.pantalla;
  bPlay.innerHTML = ICONOS.play;
  bSonido.innerHTML = ICONOS.sonido;

  var jugador = null, listo = false, canalActual = null;
  var ultimaTarjeta = null, temporizador = null, arrastrando = false, errores = 0, apiPendiente = null;

  /* ---------- API de YouTube (se carga solo al abrir el primer canal) ---------- */
  function cargarApi(cb) {
    if (window.YT && YT.Player) { cb(); return; }
    apiPendiente = cb;
    if (!document.getElementById("yt-api")) {
      var s = document.createElement("script");
      s.id = "yt-api";
      s.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(s);
    }
  }
  window.onYouTubeIframeAPIReady = function () {
    if (apiPendiente) { var f = apiPendiente; apiPendiente = null; f(); }
  };

  function formato(seg) {
    seg = Math.max(0, Math.floor(seg || 0));
    var m = Math.floor(seg / 60), s = seg % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  function cargarLista() {
    if (!canalActual || !listo || !dialogo.open) return;
    errores = 0;
    jugador.loadPlaylist({ listType: "playlist", list: canalActual });
  }

  function crearJugador() {
    if (jugador) { cargarLista(); return; }
    var vars = { controls: 0, fs: 0, rel: 0, disablekb: 1, iv_load_policy: 3, playsinline: 1 };
    if (location.protocol.indexOf("http") === 0) vars.origin = location.origin;
    jugador = new YT.Player("marco", {
      width: "100%", height: "100%", playerVars: vars,
      events: {
        onReady: function () { listo = true; cargarLista(); },
        onStateChange: function (e) {
          bPlay.innerHTML = (e.data === 1) ? ICONOS.pausa : ICONOS.play;
          if (e.data === 1) errores = 0;
        },
        // Si un video no se puede reproducir aquí, pasa al siguiente (máximo 5 seguidos).
        onError: function () {
          errores++;
          if (errores < 5) jugador.nextVideo();
        }
      }
    });
  }

  function actualizar() {
    if (!listo || !jugador.getDuration) return;
    var dur = jugador.getDuration() || 0, t = jugador.getCurrentTime() || 0;
    if (!arrastrando && dur > 0) rango.value = Math.round(t / dur * 1000);
    tiempo.textContent = formato(arrastrando ? rango.value / 1000 * dur : t) + " / " + formato(dur);
    bSonido.innerHTML = jugador.isMuted() ? ICONOS.mudo : ICONOS.sonido;
  }

  function abrirReproductor(nombre, idCanal, tarjeta) {
    ultimaTarjeta = tarjeta;
    canalActual = "UU" + idCanal.slice(2);   // lista de subidas del canal
    document.getElementById("titulo-video").textContent = nombre;
    rango.value = 0;
    tiempo.textContent = "0:00 / 0:00";
    dialogo.showModal();
    document.getElementById("cerrar").focus();
    temporizador = setInterval(actualizar, 500);
    cargarApi(crearJugador);
  }

  function cerrarReproductor() { dialogo.close(); }

  dialogo.addEventListener("close", function () {
    clearInterval(temporizador);
    canalActual = null;
    if (listo) jugador.stopVideo();
    if (document.fullscreenElement) document.exitFullscreen();
    if (ultimaTarjeta) ultimaTarjeta.focus();
  });
  dialogo.addEventListener("click", function (e) { if (e.target === dialogo) cerrarReproductor(); });
  document.getElementById("cerrar").addEventListener("click", cerrarReproductor);

  /* ---------- Botones propios ---------- */
  document.getElementById("b-anterior").addEventListener("click", function () { if (listo) jugador.previousVideo(); });
  document.getElementById("b-siguiente").addEventListener("click", function () { if (listo) jugador.nextVideo(); });
  bPlay.addEventListener("click", function () {
    if (!listo) return;
    if (jugador.getPlayerState() === 1) jugador.pauseVideo(); else jugador.playVideo();
  });
  bSonido.addEventListener("click", function () {
    if (!listo) return;
    if (jugador.isMuted()) jugador.unMute(); else jugador.mute();
    actualizar();
  });
  rango.addEventListener("input", function () { arrastrando = true; actualizar(); });
  rango.addEventListener("change", function () {
    if (listo) jugador.seekTo(jugador.getDuration() * rango.value / 1000, true);
    arrastrando = false;
  });
  var bPantalla = document.getElementById("b-pantalla");
  if (!(reproductor.requestFullscreen || reproductor.webkitRequestFullscreen)) bPantalla.hidden = true;
  bPantalla.addEventListener("click", function () {
    if (document.fullscreenElement) { document.exitFullscreen(); return; }
    (reproductor.requestFullscreen || reproductor.webkitRequestFullscreen).call(reproductor);
  });

  /* ---------- Cuadrícula de canales ---------- */
  function idDeVideo(url) {
    try {
      var u = new URL(url);
      if (u.hostname.indexOf("youtu.be") !== -1) return u.pathname.slice(1);
      if (u.searchParams.get("v")) return u.searchParams.get("v");
      var m = u.pathname.match(/\/(shorts|embed)\/([\w-]+)/);
      if (m) return m[2];
    } catch (e) {}
    return null;
  }

  function nombreDesdeUrl(url) {
    try {
      var partes = new URL(url).pathname.split("/").filter(Boolean);
      var ultimo = partes[partes.length - 1] || "Canal";
      return decodeURIComponent(ultimo.replace(/^@/, ""));
    } catch (e) { return "Canal"; }
  }

  function inicial(nombre, i) {
    var d = document.createElement("div");
    d.className = "inicial";
    d.style.background = COLORES[i % COLORES.length];
    d.textContent = nombre.charAt(0).toUpperCase();
    return d;
  }

  function crearTarjeta(item, i) {
    var url = item.url || item.enlace || "";
    if (url.indexOf("http") !== 0) return null;
    var nombre = item.nombre || item.name || nombreDesdeUrl(url);
    var idCanal = (item.id || "").trim();
    var imagen = item.imagen || item.image || "";
    if (!imagen) {
      var id = idDeVideo(url);
      if (id) imagen = "https://i.ytimg.com/vi/" + id + "/hqdefault.jpg";
    }

    var a = document.createElement("a");
    a.className = "tarjeta";
    a.href = url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    // Con id de canal se reproduce aquí mismo; sin id se abre YouTube en otra pestaña.
    if (/^UC[\w-]{22}$/.test(idCanal) && dialogo.showModal) {
      a.addEventListener("click", function (e) {
        e.preventDefault();
        abrirReproductor(nombre, idCanal, a);
      });
    }

    var media = document.createElement("div");
    media.className = "media";
    if (imagen) {
      var img = document.createElement("img");
      img.src = imagen;
      img.alt = "";
      img.loading = "lazy";
      img.onerror = function () { media.replaceChildren(inicial(nombre, i)); };
      media.appendChild(img);
    } else {
      media.appendChild(inicial(nombre, i));
    }

    var titulo = document.createElement("p");
    titulo.className = "nombre";
    titulo.textContent = nombre;

    a.appendChild(media);
    a.appendChild(titulo);
    return a;
  }

  fetch("canales.json", { cache: "no-cache" })
    .then(function (r) {
      if (!r.ok) throw new Error("No se encontró canales.json");
      return r.json();
    })
    .then(function (datos) {
      var lista = Array.isArray(datos) ? datos : (datos.canales || datos.channels || []);
      var cuadricula = document.getElementById("cuadricula");
      lista.forEach(function (item, i) {
        var t = crearTarjeta(item, i);
        if (t) cuadricula.appendChild(t);
      });
      document.getElementById("mensaje").hidden = cuadricula.children.length > 0;
      if (!cuadricula.children.length) {
        document.getElementById("mensaje").textContent = "Todavía no hay canales en canales.json.";
      }
    })
    .catch(function () {
      document.getElementById("mensaje").textContent =
        "No se pudo leer canales.json. Revisa que esté en la misma carpeta que index.html y que el formato sea correcto.";
    });
</script>
</body>
</html>
