<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; frame-src https://www.youtube.com https://www.youtube-nocookie.com; connect-src 'self' https://www.googleapis.com https://api.github.com; object-src 'none'; base-uri 'self'; form-action 'none'; media-src 'none'; worker-src 'none';">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script>
/* Escudo: bloquea ventanas emergentes y cualquier iframe/script inyectado que no sea de YouTube o de tu sitio */
(function () {
  var OK = /^https:\/\/(www\.youtube\.com|www\.youtube-nocookie\.com|i\.ytimg\.com|yt3\.ggpht\.com)\//;
  var SRC_OK = /^https:\/\/(www\.youtube\.com|www\.youtube-nocookie\.com|s\.ytimg\.com)\//;
  var abrir = window.open;
  window.open = function (u) { return OK.test(String(u || "")) ? abrir.apply(window, arguments) : null; };
  new MutationObserver(function (ms) {
    ms.forEach(function (m) {
      m.addedNodes.forEach(function (n) {
        if (n.nodeType !== 1 || !/^(IFRAME|SCRIPT|EMBED|OBJECT)$/.test(n.tagName) || !n.src) return;
        if (n.src.indexOf(location.origin) !== 0 && !SRC_OK.test(n.src)) n.remove();
      });
    });
  }).observe(document.documentElement, { childList: true, subtree: true });
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FreshMindVideo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --fondo: #f3f6f8;
    --tarjeta: #ffffff;
    --texto: #1d2b3a;
    --acento: #12a37f;
    --proporcion: 16 / 9;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: var(--texto); font-family: "Nunito", "Segoe UI", Arial, sans-serif; }
  header { position: sticky; top: 0; z-index: 10; background: var(--tarjeta); padding: 14px 24px; box-shadow: 0 1px 0 rgba(29, 43, 58, .12); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  header h1 { margin: 0; font-size: 1.6rem; font-weight: 800; color: var(--acento); letter-spacing: -.01em; cursor: pointer; }
  main { max-width: 1000px; margin: 0 auto; padding: 28px 20px 48px; }
  .cuadricula { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
  .tarjeta {
    display: block; background: var(--tarjeta); border-radius: 10px; overflow: hidden;
    color: inherit; text-decoration: none; box-shadow: 0 1px 4px rgba(29, 43, 58, .14);
    transition: transform .15s ease, box-shadow .15s ease; cursor: pointer;
  }
  .tarjeta:hover { transform: translateY(-3px); box-shadow: 0 6px 14px rgba(29, 43, 58, .18); }
  .tarjeta:focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; }
  .media { aspect-ratio: var(--proporcion); background: #dfe6ea; position: relative; }
  .media img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .inicial { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 3.2rem; font-weight: 800; color: rgba(29, 43, 58, .75); }
  .nombre { margin: 0; padding: 12px 14px 14px; font-size: 1rem; font-weight: 700; line-height: 1.3; }
  .mensaje { text-align: center; padding: 40px 16px; font-weight: 600; }

  /* Vista de Canal / Reproductor Orgánico */
  #vista-canal { display: none; }
  #vista-canal.activo { display: block; }
  #vista-principal.oculto { display: none; }

  .barra-navegacion { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
  .volver {
    padding: 8px 16px; border: 0; background: var(--acento); color: #fff; border-radius: 8px;
    cursor: pointer; font-weight: 700; font-family: inherit; display: flex; align-items: center; gap: 6px;
  }
  .volver:hover { opacity: 0.9; }
  .titulo-canal-activo { font-size: 1.4rem; font-weight: 800; margin: 0; color: var(--texto); }

  .contenedor-reproductor-principal { background: #0f1720; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.15); margin-bottom: 24px; color: #fff; }
  .video-marco-wrapper { position: relative; aspect-ratio: 16 / 9; width: 100%; background: #000; }
  .video-marco-wrapper iframe { width: 100%; height: 100%; border: 0; display: block; pointer-events: none; }
  
  .tapa {
    position: absolute; inset: 0; width: 100%; height: 100%; border: 0; margin: 0; padding: 0;
    background: #000; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 5;
  }
  .tapa[hidden] { display: none; }
  .tapa svg { width: 68px; height: 68px; fill: #fff; opacity: .92; }
  .tapa:hover svg { opacity: 1; }

  .controles { display: flex; align-items: center; gap: 4px; padding: 8px 14px; background: #1d2b3a; }
  .controles button {
    min-width: 40px; min-height: 40px; border: 0; background: none; color: #fff; border-radius: 8px;
    cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.4rem;
  }
  .controles button:hover { background: rgba(255, 255, 255, .12); }
  .controles svg { width: 22px; height: 22px; fill: currentColor; }
  .controles input[type=range] { flex: 1; min-width: 60px; accent-color: var(--acento); }
  .tiempo { min-width: 92px; text-align: center; font-size: 0.85rem; font-variant-numeric: tabular-nums; }

  /* Selector inferior de todos los videos del canal */
  .seccion-videos-canal h3 { margin: 0 0 12px 0; font-size: 1.1rem; }
  .selector-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; max-height: 520px; overflow-y: auto; padding-right: 4px; }
  .selector-grid button {
    position: relative; border: 0; padding: 0; background: var(--tarjeta); color: var(--texto);
    border-radius: 8px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column;
    text-align: left; font-family: inherit; box-shadow: 0 1px 3px rgba(29, 43, 58, .14);
  }
  .selector-grid button img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; background: #000; }
  .selector-grid .num {
    position: absolute; top: 4px; left: 4px; background: rgba(0, 0, 0, .75); color: #fff;
    font-size: .7rem; font-weight: 700; padding: 1px 6px; border-radius: 4px;
  }
  .selector-grid .titulo {
    padding: 8px 10px 10px; font-size: .85rem; font-weight: 700; line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .selector-grid button:hover { outline: 2px solid var(--acento); }

  @media (max-width: 760px) { .cuadricula { grid-template-columns: repeat(2, 1fr); gap: 14px; } }
  .controles button.activo { background: var(--acento); }
  .en-pantalla { position: fixed; inset: 0; z-index: 200; margin: 0; border-radius: 0; width: 100%; height: 100%; display: flex; flex-direction: column; background: #000; }
  .en-pantalla .video-marco-wrapper { flex: 1; aspect-ratio: auto; min-height: 0; }
  .en-pantalla .controles { position: absolute; left: 0; right: 0; bottom: 0; z-index: 8; background: linear-gradient(transparent, rgba(0,0,0,.8)); padding-top: 28px; transition: opacity .25s; }
  .en-pantalla.inactivo .controles { opacity: 0; pointer-events: none; }
  .en-pantalla.inactivo { cursor: none; }
  @media (max-width: 600px) {
    .controles { flex-wrap: wrap; }
    #rango { order: -1; flex: 1 1 calc(100% - 100px); }
    .tiempo { order: -1; }
  }
  @media (max-width: 360px) { .cuadricula { grid-template-columns: 1fr; } }
  header nav { display: flex; gap: 8px; }
  header nav button { border: 0; background: none; font: inherit; font-weight: 800; padding: 8px 14px; border-radius: 8px; cursor: pointer; color: var(--texto); }
  header nav button.activo { background: var(--acento); color: #fff; }
  .vol { position: relative; display: flex; }
  .vol-panel { display: none; position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%); background: #1d2b3a; padding: 12px 16px; border-radius: 10px; box-shadow: 0 4px 14px rgba(0,0,0,.4); z-index: 9; }
  .vol-panel.abierto { display: block; }
  .vol-panel input { width: 130px; display: block; margin: 0; }
  .selector-grid .item { position: relative; display: flex; }
  .selector-grid .item > button { width: 100%; }
  .quitar-video { position: absolute; top: 4px; right: 4px; width: 30px; height: 30px; border-radius: 50%; background: rgba(0,0,0,.75); color: #fff; font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 2; }
  /* Pantalla completa: barra al doble de tamaño */
  .en-pantalla .controles { flex-wrap: wrap; gap: 10px; padding: 40px 28px 22px; }
  .en-pantalla .controles button { min-width: 80px; min-height: 80px; }
  .en-pantalla .controles svg { width: 44px; height: 44px; }
  .en-pantalla .tiempo { font-size: 1.7rem; min-width: 190px; }
  .en-pantalla #rango { order: -1; flex: 1 1 100%; height: 40px; }
  .en-pantalla .vol-panel { padding: 22px 28px; }
  .en-pantalla .vol-panel input { width: 260px; height: 40px; }
</style>
</head>
<body>

<header>
  <h1 id="logo-inicio">FreshMindVideo</h1>
  <nav><button type="button" id="tab-canales" class="activo">Canales</button><button type="button" id="tab-videos">⭐ Mis videos</button></nav>
</header>

<main>
  <!-- VISTA PRINCIPAL: Cuadrícula de Canales -->
  <div id="vista-principal">
    <div id="cuadricula" class="cuadricula"></div>
    <p id="mensaje" class="mensaje">Cargando canales…</p>
  </div>

  <!-- VISTA DE CANAL: Reproductor orgánico y lista completa de videos -->
  <div id="vista-canal">
    <div class="barra-navegacion">
      <button class="volver" id="btn-volver" type="button">← Volver a canales</button>
      <h2 class="titulo-canal-activo" id="titulo-canal-activo"></h2>
    </div>

    <div class="contenedor-reproductor-principal" id="contenedor-reproductor">
      <div class="video-marco-wrapper">
        <div id="marco"></div>
        <button type="button" id="tapa" class="tapa" aria-label="Reproducir">
          <svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>
        </button>
      </div>
      <div class="controles" id="controles">
        <button type="button" id="b-anterior" aria-label="Video anterior"></button>
        <button type="button" id="b-play" aria-label="Reproducir o pausar"></button>
        <button type="button" id="b-siguiente" aria-label="Video siguiente"></button>
        <input type="range" id="rango" min="0" max="1000" value="0" aria-label="Avance del video">
        <span class="tiempo" id="tiempo">0:00 / 0:00</span>
        <div class="vol"><div class="vol-panel" id="vol-panel"><input type="range" id="volumen" min="0" max="100" value="100" aria-label="Volumen"></div><button type="button" id="b-sonido" aria-label="Volumen"></button></div>
        <button type="button" id="b-subs" aria-label="Subtítulos" aria-pressed="false"></button>
        <button type="button" id="b-pantalla" aria-label="Pantalla completa"></button>
      </div>
    </div>

    <div class="seccion-videos-canal">
      <h3>Todos los videos del canal (<span id="contador-total">0</span>)</h3>
      <p id="selector-mensaje">Cargando lista completa de videos…</p>
      <div class="selector-grid" id="selector-grid"></div>
    </div>
  </div>
</main>

<script>
  var COLORES = ["#ffd166", "#7bdff2", "#b2f7b8", "#ffb3c1", "#cdb4ff", "#ffc98b"];
  var ICONOS = {
    anterior: '<svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>',
    siguiente: '<svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>',
    play: '<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>',
    pausa: '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
    sonido: '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9zM16.5 12a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>',
    mudo: '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9z"/><path d="M15 9l6 6M21 9l-6 6" stroke="currentColor" stroke-width="2" fill="none"/></svg>',
    pantalla: '<svg viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4zM20 4v6h-2V6h-4V4zM4 20v-6h2v4h4v2zM20 20h-6v-2h4v-4h2z"/></svg>',
    salir: '<svg viewBox="0 0 24 24"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>',
    subs: '<svg viewBox="0 0 24 24"><path d="M19 4H5c-1.11 0-2 .9-2 2v12c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 7H9.5v-.5h-2v3h2V13H11v1c0 .55-.45 1-1 1H7c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1h3c.55 0 1 .45 1 1v1zm7 0h-1.5v-.5h-2v3h2V13H18v1c0 .55-.45 1-1 1h-3c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1h3c.55 0 1 .45 1 1v1z"/></svg>'
  };

  var vistaPrincipal = document.getElementById("vista-principal");
  var vistaCanal = document.getElementById("vista-canal");
  var tituloCanalActivo = document.getElementById("titulo-canal-activo");
  var selectorGrid = document.getElementById("selector-grid");
  var selectorMensaje = document.getElementById("selector-mensaje");
  var contadorTotal = document.getElementById("contador-total");

  var bPlay = document.getElementById("b-play");
  var bSonido = document.getElementById("b-sonido");
  var bAnterior = document.getElementById("b-anterior");
  var bSiguiente = document.getElementById("b-siguiente");
  var rango = document.getElementById("rango");
  var tiempo = document.getElementById("tiempo");
  var tapa = document.getElementById("tapa");
  var wrapperVideo = document.querySelector(".video-marco-wrapper");

  bAnterior.innerHTML = ICONOS.anterior;
  bSiguiente.innerHTML = ICONOS.siguiente;
  document.getElementById("b-pantalla").innerHTML = ICONOS.pantalla;
  bPlay.innerHTML = ICONOS.play;
  bSonido.innerHTML = ICONOS.sonido;
  document.getElementById("b-subs").innerHTML = ICONOS.subs;

  var jugador = null, listo = false, canalActual = null;
  var listaVideos = [];   // IDs de los videos del canal
  var titulos = [];       // nombres, en el mismo orden que listaVideos
  var indiceActual = 0;
  var temporizador = null, arrastrando = false, errores = 0, apiPendiente = null;
  var esperandoLista = false; // solo se usa si falla la API de datos
  var videoInicial = null;    // video que se debe dejar listo (viene del buscador)
  var videoActualId = null, yaPreparado = false;
  var LS_LISTAS = "fmv_listas";

  function cargarApi(cb) {
    if (window.YT && YT.Player) { cb(); return; }
    apiPendiente = cb;
    if (!document.getElementById("yt-api")) {
      var s = document.createElement("script");
      s.id = "yt-api";
      s.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(s);
    }
  }
  window.onYouTubeIframeAPIReady = function () {
    if (apiPendiente) { var f = apiPendiente; apiPendiente = null; f(); }
  };

  function formato(seg) {
    seg = Math.max(0, Math.floor(seg || 0));
    var m = Math.floor(seg / 60), s = seg % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  /* ---------- Caché pequeña de listas (6 horas, máximo 8 canales) ---------- */
  function lsLeer(k) { try { return JSON.parse(localStorage.getItem(k)) || {}; } catch (e) { return {}; } }
  function lsGuardar(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function listaEnCache(canal) {
    var e = lsLeer(LS_LISTAS)[canal];
    return (e && e.ids && e.ids.length && Date.now() - e.t < 216e5) ? e : null;
  }
  function guardarListaCache(canal, ids, nombres) {
    var m = lsLeer(LS_LISTAS);
    m[canal] = { t: Date.now(), ids: ids, titulos: nombres };
    Object.keys(m).sort(function (a, b) { return m[b].t - m[a].t; }).slice(8).forEach(function (k) { delete m[k]; });
    lsGuardar(LS_LISTAS, m);
  }

  /* ---------- Selector de videos (miniatura + título) ---------- */
  function agregarBoton(i) {
    var w = document.createElement("div");
    w.className = "item";
    var b = document.createElement("button");
    b.type = "button";
    var img = document.createElement("img");
    img.src = "https://i.ytimg.com/vi/" + listaVideos[i] + "/mqdefault.jpg";
    img.alt = ""; img.loading = "lazy";
    var num = document.createElement("span"); num.className = "num"; num.textContent = (i + 1);
    var t = document.createElement("span"); t.className = "titulo"; t.textContent = titulos[i] || ("Video " + (i + 1));
    b.appendChild(img); b.appendChild(num); b.appendChild(t);
    b.addEventListener("click", function () { irA(i, true); });
    w.appendChild(b);
    if (window.FMV_esPadre && FMV_esPadre()) {           // punto 4: quitar video individual
      var q = document.createElement("span");
      q.className = "quitar-video"; q.textContent = "×"; q.title = "Quitar video";
      q.addEventListener("click", function (e) { e.stopPropagation(); quitarVideo(i); });
      w.appendChild(q);
    }
    selectorGrid.appendChild(w);
  }

  function quitarVideo(i) {
    if (!confirm("¿Quitar este video?")) return;
    var id = listaVideos[i];
    if (canalActual === "MIS") FMV_quitarPropio(id); else FMV_bloquear(id);
    var eraActual = (id === videoActualId);
    listaVideos.splice(i, 1); titulos.splice(i, 1);
    contadorTotal.textContent = listaVideos.length;
    construirSelector(0);
    if (eraActual) {
      if (listaVideos.length) irA(Math.min(i, listaVideos.length - 1), false);
      else if (listo) { jugador.stopVideo(); tapa.hidden = false; }
    }
  }

  function sinBloqueados() {
    var b = window.FMV_bloqueados ? FMV_bloqueados() : [], ni = [], nt = [];
    listaVideos.forEach(function (id, i) { if (b.indexOf(id) < 0) { ni.push(id); nt.push(titulos[i]); } });
    listaVideos = ni; titulos = nt;
  }

  function construirSelector(desde) {
    selectorMensaje.style.display = "none";
    if (!desde) selectorGrid.innerHTML = "";
    contadorTotal.textContent = listaVideos.length;
    for (var i = desde || 0; i < listaVideos.length; i++) agregarBoton(i);
    sincronizarIndice();
  }

  /* ---------- Reproducción con nuestra propia lista ---------- */
  function irA(i, subir) {
    if (!listo || !listaVideos.length) return;
    indiceActual = i;
    videoActualId = listaVideos[i];
    tapa.hidden = true;
    jugador.loadVideoById(listaVideos[i]);
    aplicarOrientacion();
    if (subir) window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function siguienteVideo() {
    if (!listaVideos.length) return;
    irA((indiceActual + 1) % listaVideos.length, false);
  }

  function anteriorVideo() {
    if (!listaVideos.length) return;
    irA((indiceActual - 1 + listaVideos.length) % listaVideos.length, false);
  }

  function sincronizarIndice() {
    if (!videoActualId) return;
    var k = listaVideos.indexOf(videoActualId);
    if (k >= 0) indiceActual = k;
  }

  function prepararPrimero() {
    if (!listo || yaPreparado) return;
    var id = videoInicial || listaVideos[0];
    if (!id) return;
    yaPreparado = true;
    videoActualId = id;
    indiceActual = 0;
    jugador.loadVideoById(id); // se reproduce solo (si el navegador lo bloquea, queda el botón de play)
    sincronizarIndice();
  }

  /* ---------- Cargar la lista del canal (con títulos) ---------- */
  function cargarLista() {
    var canal = canalActual, clave = window.FMV_API_KEY;

    var cache = listaEnCache(canal);
    if (cache) {
      listaVideos = cache.ids.slice();
      titulos = (cache.titulos || []).slice();
      sinBloqueados();
      construirSelector(0);
      prepararPrimero();
      return;
    }
    if (!clave) { usarListaDelReproductor(); return; }

    var ids = [], nombres = [];
    var bloq = window.FMV_bloqueados ? FMV_bloqueados() : [];
    function pagina(token) {
      fetch("https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=50&playlistId=" +
            encodeURIComponent(canal) + "&key=" + encodeURIComponent(clave) +
            (token ? "&pageToken=" + encodeURIComponent(token) : ""))
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (canal !== canalActual) return; // cambió de canal mientras cargaba
          if (d.error) throw new Error(d.error.message);
          var antes = ids.length;
          (d.items || []).forEach(function (it) {
            var s = it.snippet;
            if (!s || !s.resourceId || !s.resourceId.videoId) return;
            if (s.title === "Private video" || s.title === "Deleted video") return;
            if (bloq.indexOf(s.resourceId.videoId) >= 0) return;
            ids.push(s.resourceId.videoId);
            nombres.push(s.title);
          });
          listaVideos = ids;
          titulos = nombres;
          construirSelector(antes);
          if (antes === 0 && ids.length) prepararPrimero();
          if (d.nextPageToken && ids.length < 1000) pagina(d.nextPageToken);
          else guardarListaCache(canal, ids, nombres);
        })
        .catch(function () {
          if (canal !== canalActual) return;
          if (!ids.length) usarListaDelReproductor(); // plan B: solo miniaturas
        });
    }
    pagina("");
  }

  /* Plan B si la API de datos falla o se acaba la cuota: solo miniaturas con número */
  function usarListaDelReproductor() {
    var canal = canalActual;
    if (!listo) {
      setTimeout(function () { if (canal === canalActual) usarListaDelReproductor(); }, 300);
      return;
    }
    esperandoLista = true;
    jugador.cuePlaylist({ listType: "playlist", list: canal, index: 0 });
  }

  function leerListaDelReproductor(intento) {
    var canal = canalActual;
    var lista = (jugador.getPlaylist && jugador.getPlaylist()) || [];
    if (lista.length) {
      listaVideos = lista.slice();
      titulos = [];
      sinBloqueados();
      construirSelector(0);
      prepararPrimero();
    } else if (intento < 10) {
      setTimeout(function () { if (canal === canalActual) leerListaDelReproductor(intento + 1); }, 500);
    } else {
      selectorMensaje.style.display = "block";
      selectorMensaje.textContent = "No se pudieron recuperar los videos de este canal.";
    }
  }

  function iniciarCanal(idCanal, nombreCanal, videoId) {
    canalActual = "UU" + idCanal.slice(2);
    abrirReproductor(nombreCanal, videoId, cargarLista);
  }

  /* Pestaña "Mis videos": mismo reproductor (con la misma tapa anti-clics) */
  function iniciarMisVideos() {
    canalActual = "MIS";
    location.hash = "videos";
    abrirReproductor("⭐ Mis videos", null, function () {
      var vs = window.FMV_misVideos ? FMV_misVideos() : [];
      listaVideos = vs.map(function (v) { return v.id; });
      titulos = vs.map(function (v) { return v.titulo || ""; });
      if (!listaVideos.length) {
        selectorMensaje.style.display = "block";
        selectorMensaje.textContent = "Aún no hay videos individuales. Agrégalos con 🔍 Buscar (zona de padres).";
        if (listo) jugador.stopVideo();
        return;
      }
      construirSelector(0);
      prepararPrimero();
    });
  }

  function abrirReproductor(nombreCanal, videoId, cargarFn) {
    videoInicial = videoId || null;
    videoActualId = null;
    yaPreparado = false;
    tituloCanalActivo.textContent = nombreCanal;
    document.getElementById("tab-videos").classList.toggle("activo", canalActual === "MIS");
    document.getElementById("tab-canales").classList.toggle("activo", canalActual !== "MIS");
    vistaPrincipal.classList.add("oculto");
    vistaCanal.classList.add("activo");

    listaVideos = [];
    titulos = [];
    esperandoLista = false;
    selectorGrid.innerHTML = "";
    selectorMensaje.style.display = "block";
    selectorMensaje.textContent = "Cargando videos...";
    contadorTotal.textContent = "0";
    tapa.hidden = false;

    cargarApi(function () {
      if (jugador) return;
      var vars = { controls: 0, fs: 0, rel: 0, disablekb: 1, iv_load_policy: 3, playsinline: 1 };
      if (location.protocol.indexOf("http") === 0) vars.origin = location.origin;
      jugador = new YT.Player("marco", {
        width: "100%", height: "100%",
        host: "https://www.youtube-nocookie.com",
        playerVars: vars,
        events: {
          onReady: function () {
            listo = true;
            prepararPrimero();
          },
          onStateChange: function (e) {
            bPlay.innerHTML = (e.data === 1) ? ICONOS.pausa : ICONOS.play;
            if (e.data === 1) { tapa.hidden = true; errores = 0; if (subsOn && videoConSubs !== videoActualId) { videoConSubs = videoActualId; aplicarSubs(); } }
            else if (e.data === 2) { tapa.hidden = false; }
            if (e.data === 5 && esperandoLista) {
              esperandoLista = false;
              leerListaDelReproductor(0);
            }
            if (e.data === 0) {
              siguienteVideo();
            }
          },
          onError: function () {
            errores++;
            if (errores < 5) siguienteVideo();
          }
        }
      });
    });

    cargarFn();
    if (videoInicial) prepararPrimero(); // viene del buscador: dejarlo listo de inmediato

    if (!temporizador) {
      temporizador = setInterval(actualizarCronometro, 500);
    }
  }

  function actualizarCronometro() {
    if (!listo || !jugador.getDuration) return;
    var dur = jugador.getDuration() || 0, t = jugador.getCurrentTime() || 0;
    if (!arrastrando && dur > 0) rango.value = Math.round(t / dur * 1000);
    tiempo.textContent = formato(arrastrando ? rango.value / 1000 * dur : t) + " / " + formato(dur);
    pintarSonido();
    if (!moviendoVol) volumen.value = jugador.isMuted() ? 0 : jugador.getVolume();
  }

  function regresarAprincipal() {
    document.getElementById("tab-canales").classList.add("activo");
    document.getElementById("tab-videos").classList.remove("activo");
    history.replaceState(null, "", location.pathname + location.search);
    vistaCanal.classList.remove("activo");
    vistaPrincipal.classList.remove("oculto");
    if (listo && jugador.stopVideo) {
      jugador.stopVideo();
    }
    if (temporizador) {
      clearInterval(temporizador);
      temporizador = null;
    }
  }

  document.getElementById("btn-volver").addEventListener("click", regresarAprincipal);
  document.getElementById("logo-inicio").addEventListener("click", regresarAprincipal);
  document.getElementById("tab-canales").addEventListener("click", regresarAprincipal);
  document.getElementById("tab-videos").addEventListener("click", iniciarMisVideos);
  window.FMV_alListo = function () { window.FMV_alListo = null; if (location.hash === "#videos") iniciarMisVideos(); };
  window.FMV_repintarSelector = function () { if (vistaCanal.classList.contains("activo") && listaVideos.length) construirSelector(0); };
  window.FMV_tabVideos = function (n) { document.getElementById("tab-videos").textContent = "⭐ Mis videos" + (n ? " (" + n + ")" : ""); };

  // Controles del reproductor
  bAnterior.addEventListener("click", anteriorVideo);
  bSiguiente.addEventListener("click", siguienteVideo);
  bPlay.addEventListener("click", function () {
    if (!listo) return;
    if (jugador.getPlayerState() === 1) jugador.pauseVideo(); else jugador.playVideo();
  });
  tapa.addEventListener("click", function () {
    if (listo) jugador.playVideo();
  });
  var volPanel = document.getElementById("vol-panel"), tVol = null;
  function cerrarVol() { volPanel.classList.remove("abierto"); }
  function pintarSonido() {
    if (!listo) return;
    bSonido.innerHTML = (jugador.isMuted() || !jugador.getVolume()) ? ICONOS.mudo : ICONOS.sonido;
  }
  bSonido.addEventListener("click", function (e) {
    e.stopPropagation();
    volPanel.classList.toggle("abierto");
    clearTimeout(tVol);
    if (volPanel.classList.contains("abierto")) tVol = setTimeout(cerrarVol, 4000);
  });
  volPanel.addEventListener("click", function (e) { e.stopPropagation(); });
  document.addEventListener("click", cerrarVol);
  rango.addEventListener("input", function () { arrastrando = true; });
  rango.addEventListener("change", function () {
    if (listo) jugador.seekTo(jugador.getDuration() * rango.value / 1000, true);
    arrastrando = false;
  });

  /* ---------- Volumen (en iPhone/iPad el volumen se maneja con los botones del equipo) ---------- */
  var volumen = document.getElementById("volumen"), moviendoVol = false;
  volumen.addEventListener("input", function () {
    if (!listo) return;
    moviendoVol = true; clearTimeout(tVol);
    var v = +volumen.value;
    jugador.setVolume(v);
    if (v === 0) jugador.mute(); else if (jugador.isMuted()) jugador.unMute();
    pintarSonido();
  });
  volumen.addEventListener("change", function () { moviendoVol = false; tVol = setTimeout(cerrarVol, 3000); });

  /* ---------- Subtítulos (función interna de YouTube, solo si el video los tiene) ---------- */
  var bSubs = document.getElementById("b-subs"), subsOn = false, videoConSubs = null;
  try { subsOn = localStorage.getItem("fmv_subs") === "1"; } catch (e) {}
  function pintarSubs() { bSubs.classList.toggle("activo", subsOn); bSubs.setAttribute("aria-pressed", subsOn); }
  function aplicarSubs() {
    if (!listo) return;
    try {
      if (!subsOn) { jugador.unloadModule("captions"); return; }
      jugador.loadModule("captions");
      setTimeout(function () {
        var p = jugador.getOption("captions", "tracklist") || [];
        var es = p.filter(function (x) { return /^es/.test(x.languageCode); })[0] || p[0];
        if (es) jugador.setOption("captions", "track", { languageCode: es.languageCode });
      }, 700);
    } catch (e) {}
  }
  pintarSubs();
  bSubs.addEventListener("click", function () {
    subsOn = !subsOn;
    try { localStorage.setItem("fmv_subs", subsOn ? "1" : "0"); } catch (e) {}
    videoConSubs = videoActualId;
    pintarSubs(); aplicarSubs();
  });

  /* ---------- Pantalla completa con nuestros propios controles ---------- */
  var contenedor = document.getElementById("contenedor-reproductor");
  var bPantalla = document.getElementById("b-pantalla"), tOculta = null;
  function nativa() { return document.fullscreenElement || document.webkitFullscreenElement; }
  function enPantalla() { return contenedor.classList.contains("en-pantalla"); }
  function ocultarYa() { if (listo && jugador.getPlayerState() === 1) contenedor.classList.add("inactivo"); }
  function programarOcultar() {
    clearTimeout(tOculta);
    if (enPantalla()) tOculta = setTimeout(ocultarYa, 3000);
  }
  function mostrarControles() { contenedor.classList.remove("inactivo"); programarOcultar(); }
  function activarPantalla(si) {
    contenedor.classList.toggle("en-pantalla", si);
    contenedor.classList.remove("inactivo");
    bPantalla.innerHTML = si ? ICONOS.salir : ICONOS.pantalla;
    document.body.style.overflow = si ? "hidden" : "";
    clearTimeout(tOculta);
    if (si) { programarOcultar(); aplicarOrientacion(); }
    else { try { screen.orientation.unlock(); } catch (e) {} }
  }
  var orientacion = {};
  function detectarOrientacion(id, cb) {
    if (orientacion[id]) { cb(orientacion[id]); return; }
    var im = new Image();
    im.crossOrigin = "anonymous";
    im.onload = function () {
      try {
        var c = document.createElement("canvas"); c.width = 64; c.height = 36;
        var g = c.getContext("2d"); g.drawImage(im, 0, 0, 64, 36);
        var d = g.getImageData(0, 0, 64, 36).data;
        var brillo = function (x0, x1) {
          var s = 0, n = 0;
          for (var y = 0; y < 36; y++) for (var x = x0; x < x1; x++) { var k = (y * 64 + x) * 4; s += d[k] + d[k + 1] + d[k + 2]; n += 3; }
          return s / n;
        };
        var lados = (brillo(0, 10) + brillo(54, 64)) / 2, centro = brillo(20, 44);
        cb(orientacion[id] = (lados < 10 && centro > lados + 20) ? "v" : "h");
      } catch (e) { cb(null); }
    };
    im.onerror = function () { cb(null); };
    im.src = "https://i.ytimg.com/vi/" + id + "/mqdefault.jpg";
  }
  function aplicarOrientacion() {
    if (!enPantalla() || !videoActualId || !screen.orientation) return;
    var id = videoActualId;
    detectarOrientacion(id, function (o) {
      if (!enPantalla() || id !== videoActualId) return;
      try {
        if (o === "v") screen.orientation.lock("portrait").catch(function () {});
        else if (o === "h") screen.orientation.lock("landscape").catch(function () {});
        else screen.orientation.unlock();          // si no se pudo saber, no forzar nada
      } catch (e) {}
    });
  }
  function entrarPantalla() {
    var rf = contenedor.requestFullscreen || contenedor.webkitRequestFullscreen;
    if (!rf) { activarPantalla(true); return; } // iPhone: pantalla completa simulada
    var p = rf.call(contenedor);
    if (p && p.catch) p.catch(function () { activarPantalla(true); });
  }
  function salirPantalla() {
    if (nativa()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else activarPantalla(false);
  }
  function cambioNativo() { activarPantalla(!!nativa()); }
  document.addEventListener("fullscreenchange", cambioNativo);
  document.addEventListener("webkitfullscreenchange", cambioNativo);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && enPantalla() && !nativa()) salirPantalla(); });
  bPantalla.addEventListener("click", function () { if (enPantalla()) salirPantalla(); else entrarPantalla(); });
  contenedor.addEventListener("pointermove", mostrarControles);
  document.getElementById("controles").addEventListener("pointerdown", mostrarControles);
  wrapperVideo.addEventListener("click", function () {
    if (!enPantalla()) return;
    if (contenedor.classList.contains("inactivo")) mostrarControles();
    else { clearTimeout(tOculta); ocultarYa(); }
  });

  // Generación de tarjetas con imágenes automáticas basadas en el ID del canal
  function inicial(nombre, i) {
    var d = document.createElement("div");
    d.className = "inicial";
    d.style.background = COLORES[i % COLORES.length];
    d.textContent = nombre.charAt(0).toUpperCase();
    return d;
  }

  function crearTarjeta(item, i) {
    var url = item.url || item.enlace || "";
    if (!url) return null;
    var nombre = item.nombre || item.name || "Canal";
    var idCanal = (item.id || "").trim();
    var imagen = item.imagen || item.image || "";

    var a = document.createElement("div");
    a.className = "tarjeta";

    var media = document.createElement("div");
    media.className = "media";

    // Si no pones imagen en el JSON, la obtenemos automáticamente de YouTube usando el ID del canal
    if (!imagen && /^UC[\w-]{22}$/.test(idCanal)) {
      // Truco para obtener el banner/avatar automático de YouTube a partir del ID del canal
      imagen = "https://yt3.googleusercontent.com/ytc/" + idCanal; 
    }

    if (imagen) {
      var img = document.createElement("img");
      img.src = imagen;
      img.alt = "";
      img.loading = "lazy";
      // Si falla la imagen automática, recurre a la inicial colorida
      img.onerror = function () { media.replaceChildren(inicial(nombre, i)); };
      media.appendChild(img);
    } else {
      media.appendChild(inicial(nombre, i));
    }

    var titulo = document.createElement("p");
    titulo.className = "nombre";
    titulo.textContent = nombre;

    a.appendChild(media);
    a.appendChild(titulo);

    if (/^UC[\w-]{22}$/.test(idCanal)) {
      a.addEventListener("click", function () {
        iniciarCanal(idCanal, nombre);
      });
    } else {
      a.addEventListener("click", function () {
        window.open(url, "_blank");
      });
    }

    return a;
  }

  fetch("canales.json", { cache: "no-cache" })
    .then(function (r) {
      if (!r.ok) throw new Error("No se encontró canales.json");
      return r.json();
    })
    .then(function (datos) {
      var lista = Array.isArray(datos) ? datos : (datos.canales || datos.channels || []);
      var cuadricula = document.getElementById("cuadricula");
      lista.forEach(function (item, i) {
        var t = crearTarjeta(item, i);
        if (t) cuadricula.appendChild(t);
      });
      document.getElementById("mensaje").hidden = cuadricula.children.length > 0;
    })
    .catch(function () {
      document.getElementById("mensaje").textContent = "No se pudo leer canales.json.";
    });
</script>
