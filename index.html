<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreshMind Games</title>

<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="manifest" href="site.webmanifest">

<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
<script src="https://www.youtube.com/iframe_api"></script>

<style>
*{box-sizing:border-box}

body{
  font-family:Arial,sans-serif;
  background:url('fondo.jpg') no-repeat center center fixed;
  background-size:cover;
  color:white;
  margin:0;
  padding:20px
}

h1{text-align:center}

.logo{
  width:100%;
  max-width:260px;
  height:110px;
  object-fit:cover;
  clip-path:inset(0 3px 0 0)
}

h1{margin:10px 0}

/* BUSCADOR */
.top-tools{
  position:absolute;
  top:20px;
  right:25px;
  display:flex;
  justify-content:flex-end;
  z-index:100;
}

.search-box{
  width:250px;
  padding:9px 12px;
  border:1px solid rgba(255,255,255,.3);
  border-radius:20px;
  background:rgba(0,0,0,.55);
  color:white;
  outline:none;
}

.search-box::placeholder{
  color:#ddd;
}

/* CATEGORÍAS */
.categories{
  max-width:900px;
  margin:10px auto 18px;
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:5px 2px 9px;
  scrollbar-width:thin;
}

.category-btn{
  flex:0 0 auto;
  border:0;
  border-radius:20px;
  padding:8px 15px;
  background:rgba(0,0,0,.60);
  color:white;
  cursor:pointer;
  white-space:nowrap;
  transition:.2s;
}

.category-btn:hover{
  background:rgba(58,123,213,.8);
  transform:scale(1.03);
}

.category-btn.active{
  background:#3a7bd5;
}

/* JUEGOS */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:15px;
  max-width:900px;
  margin:20px auto
}

.card{
  background:none;
  border-radius:10px;
  padding:10px;
  text-align:center;
  cursor:pointer;
  transition:.2s;
  position:relative
}

.card:hover{transform:scale(1.05)}

.card img{
  width:100%;
  height:160px;
  object-fit:cover;
  border-radius:16px
}

.card p{
  position:absolute;
  left:10px;
  right:10px;
  bottom:10px;
  margin:0;
  padding:26px 8px 8px;
  box-sizing:border-box;
  border-radius:0 0 16px 16px;
  background:linear-gradient(transparent,rgba(0,0,0,.75));
  color:white;
  font-size:14px;
  font-weight:bold;
  opacity:0;
  transition:.2s
}

.card:hover p{opacity:1}

/* REPRODUCTOR */
#player-container{
  display:none;
  max-width:900px;
  margin:20px auto;
  text-align:center
}

#ruffle-target{
  width:100%;
  max-width:854px;
  height:70vh;
  max-height:550px;
  margin:0 auto;
  background:black;
  border-radius:8px;
  overflow:hidden;
  position:relative
}

#ruffle-target:fullscreen,
#ruffle-target:-webkit-full-screen{
  max-width:none;
  max-height:none;
  width:100vw;
  height:100vh
}

#ruffle-target iframe,
#ruffle-target>*{
  width:100%!important;
  height:100%!important;
  display:block;
  border:none
}

/* CAPA PROTECTORA YOUTUBE */
.youtube-player{
  width:100%;
  height:100%;
  position:relative;
  background:#000;
}

.youtube-frame{
  width:100%;
  height:100%;
  border:0;
  display:block;
}

.youtube-full-shield{
  position:absolute;
  inset:0;
  z-index:5;
  background:transparent;
  pointer-events:auto;
}

/* Capa invisible encima de la protección: tocar = pausa/reanuda. */
.youtube-tap-layer{
  position:absolute;
  inset:0;
  z-index:6;
  background:transparent;
  pointer-events:auto;
  cursor:pointer;
}

/* Pantalla negra antes del final:
   bloquea la pantalla de recomendaciones de YouTube. */
.youtube-end-shield{
  position:absolute;
  inset:0;
  z-index:20;
  background:#000;
  display:none;
  pointer-events:auto;
}

/* CONTROLES PROPIOS YOUTUBE */
.youtube-controls{
  margin-top:8px;
  padding:0 4px;
}

.youtube-time-row{
  display:flex;
  align-items:center;
  gap:8px;
  width:100%;
}

.youtube-time-row span{
  min-width:42px;
  color:#222;
  font-size:12px;
  font-weight:700;
  text-align:center;
}

#youtube-progress{
  flex:1;
  min-width:120px;
  cursor:pointer;
}

.youtube-button-row{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:7px;
  margin-top:7px;
}

.youtube-controls button{
  padding:7px 10px;
  border:0;
  border-radius:6px;
  background:#333;
  color:#fff;
  cursor:pointer;
}

.youtube-controls button:hover{
  background:#555;
}

.controls-bar{
  margin-top:10px;
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

#close-btn,#fullscreen-btn{
  padding:8px 16px;
  border:none;
  color:white;
  border-radius:6px;
  cursor:pointer
}

#close-btn{background:#e94560}
#fullscreen-btn{background:#3a7bd5}

/* ADMIN */
#admin-launcher{
  position:fixed;
  right:14px;
  bottom:14px;
  width:46px;
  height:46px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.9);
  font-size:22px;
  cursor:pointer;
  box-shadow:0 3px 12px rgba(0,0,0,.35);
  z-index:1000
}

#admin-panel{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.78);
  z-index:999;
  padding:18px;
  overflow:auto
}

.admin-box{
  max-width:900px;
  margin:20px auto;
  background:#171717;
  border-radius:14px;
  padding:20px;
  box-shadow:0 10px 40px rgba(0,0,0,.5)
}

.admin-box h2{margin-top:0}

.admin-actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:16px
}

.admin-actions button,
.admin-box button{
  padding:9px 12px;
  border:0;
  border-radius:7px;
  cursor:pointer
}

.admin-list{
  display:grid;
  gap:8px
}

.admin-row{
  background:#242424;
  padding:10px;
  border-radius:9px;
  display:flex;
  align-items:center;
  gap:10px
}

.admin-row img{
  width:50px;
  height:50px;
  object-fit:cover;
  border-radius:7px
}

.admin-row .grow{flex:1}

.admin-muted{
  opacity:.75;
  font-size:13px
}

#pin-screen{text-align:center}

.pin-input{
  font-size:22px;
  text-align:center;
  letter-spacing:6px;
  padding:10px;
  width:130px
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.form-grid label{
  display:flex;
  flex-direction:column;
  gap:5px;
  font-size:13px
}

.form-grid input,
.form-grid select{
  padding:9px;
  border-radius:6px;
  border:1px solid #555;
  background:#292929;
  color:#fff
}

.preview-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:10px;
  margin-top:12px
}

.preview{
  background:#252525;
  padding:8px;
  border-radius:8px
}

.preview img{
  width:100%;
  height:110px;
  object-fit:cover;
  border-radius:6px
}

.image-search-button{
  margin-top:5px;
  background:#555;
  color:#fff;
}

.youtube-extra{
  grid-column:1/-1;
  background:#292929;
  padding:10px;
  border-radius:8px;
}

.youtube-extra label{
  margin-bottom:8px;
}

@media(max-width:600px){
  .form-grid{grid-template-columns:1fr}

  .admin-row{
    align-items:flex-start
  }

  .admin-row img{
    width:42px;
    height:42px
  }

  .search-box{
    width:210px
  }
}
</style>
</head>

<body>

<h1>
  <img src="portadas/logo.png" alt="FreshMind Games" class="logo">
</h1>

<!-- BUSCADOR ARRIBA A LA DERECHA -->
<div class="top-tools">
  <input
    id="searchInput"
    class="search-box"
    type="search"
    placeholder="🔎 Buscar juego..."
    oninput="aplicarFiltros()"
  >
</div>

<!-- CATEGORÍAS -->
<div id="categories" class="categories"></div>

<div id="grid" class="grid"></div>

<!-- REPRODUCTOR -->
<div id="player-container">

  <div id="ruffle-target"></div>

  <div id="youtube-controls" class="youtube-controls" style="display:none">
    <div class="youtube-time-row">
      <span id="youtube-current-time">0:00</span>
      <input
        id="youtube-progress"
        type="range"
        min="0"
        max="100"
        value="0"
        step="0.1"
        oninput="youtubePreviewSeek(this.value)"
        onchange="youtubeSeekTo(this.value)"
        aria-label="Barra de tiempo del video"
      >
      <span id="youtube-duration">0:00</span>
    </div>
    <div class="youtube-button-row">
      <button onclick="youtubePlay()">▶️</button>
      <button onclick="youtubePause()">⏸️</button>
      <button onclick="youtubeSeek(-10)">⏪ 10s</button>
      <button onclick="youtubeSeek(10)">⏩ 10s</button>
    </div>
  </div>

  <div class="controls-bar">
    <button id="fullscreen-btn" onclick="pantallaCompleta()">
      ⛶ Pantalla completa
    </button>

    <button id="close-btn" onclick="cerrarJuego()">
      Cerrar juego
    </button>
  </div>

</div>

<button
  id="admin-launcher"
  title="Administrar FreshMind Games"
  onclick="abrirAdmin()"
>⚙️</button>

<!-- ADMIN -->
<div id="admin-panel">

  <div class="admin-box">

    <div id="pin-screen">
      <h2>🔐 Administración</h2>
      <p>Introduce el PIN para entrar.</p>

      <input
        id="pin"
        class="pin-input"
        type="password"
        inputmode="numeric"
        maxlength="4"
        placeholder="••••"
      >

      <br><br>

      <button onclick="validarPin()">Entrar</button>
      <button onclick="cerrarAdmin()">Cerrar</button>

      <p id="pin-error" style="color:#ff8b8b"></p>
    </div>

    <div id="admin-content" style="display:none">

      <h2>⚙️ Administrar FreshMind Games</h2>

      <p class="admin-muted">
        Catálogo cargado desde <b>juegos.json</b>.
      </p>

      <div class="admin-actions">

        <button onclick="mostrarAgregar()">
          ➕ Agregar juego
        </button>

        <button onclick="mostrarMultiples()">
          ⚙️ Agregar hasta 20
        </button>

        <button onclick="exportarJSON()">
          💾 Exportar catálogo
        </button>

        <button onclick="mostrarGitHub()">
          ☁️ Actualizar GitHub
        </button>

        <button onclick="importarJSON()">
          📥 Importar catálogo
        </button>

        <button onclick="document.getElementById('jsonFile').click()">
          📂 Abrir JSON
        </button>

        <button onclick="cerrarAdmin()">
          Cerrar
        </button>

        <input
          id="jsonFile"
          type="file"
          accept=".json,application/json"
          style="display:none"
          onchange="leerJSON(event)"
        >

      </div>

      <div id="github-config" style="display:none;margin:14px 0;padding:14px;border-radius:14px;background:rgba(0,0,0,.16)">
        <h3 style="margin:0 0 8px">☁️ Actualizar juegos.json en GitHub</h3>
        <p class="admin-muted" style="margin:0 0 10px">
          Usa un token de GitHub con permiso <b>Contents: Read and write</b> solamente para este repositorio.
        </p>
        <div style="display:grid;gap:8px">
          <input id="gh-owner" placeholder="Usuario de GitHub" value="luis98andi">
          <input id="gh-repo" placeholder="Repositorio" value="juegosaludables">
          <input id="gh-path" placeholder="Archivo" value="juegos.json">
          <input id="gh-branch" placeholder="Rama" value="main">
          <input id="gh-token" type="password" placeholder="Token de GitHub">
        </div>
        <div class="admin-actions" style="margin-top:10px">
          <button onclick="guardarConfigGitHub()">💾 Guardar configuración</button>
          <button onclick="actualizarGitHub()">☁️ ACTUALIZAR GITHUB</button>
          <button onclick="ocultarGitHub()">Cerrar</button>
        </div>
        <p id="github-status" class="admin-muted" style="margin:8px 0 0"></p>
      </div>

      <div id="editor"></div>
      <div id="admin-list" class="admin-list"></div>

    </div>

  </div>

</div>

<script>

let catalogo={
  version:1,
  categorias:[],
  juegos:[]
};

let currentPlayer=null;
let youtubePlayer=null;
let youtubeReady=false;
let currentYoutubeStart=0;
let categoriaActual="Todos";
let youtubeEndTimer=null;
let youtubeEndedByProtection=false;

const PIN="1234";

/* =========================
   YOUTUBE API
========================= */

function onYouTubeIframeAPIReady(){
  youtubeReady=true;
}

function extraerYouTubeId(url){

  try{

    const u=new URL(url);

    if(u.hostname.includes("youtu.be")){
      return u.pathname.replace("/","").split("/")[0];
    }

    if(u.hostname.includes("youtube.com")){

      if(u.pathname==="/watch"){
        return u.searchParams.get("v");
      }

      if(u.pathname.startsWith("/shorts/")){
        return u.pathname.split("/")[2];
      }

      if(u.pathname.startsWith("/embed/")){
        return u.pathname.split("/")[2];
      }

    }

  }catch(e){}

  return null;
}

function convertirTiempoASegundos(valor){

  if(!valor)return 0;

  valor=String(valor).trim();

  if(/^\d+$/.test(valor)){
    return parseInt(valor);
  }

  const partes=valor.split(":").map(Number);

  if(partes.some(isNaN))return 0;

  if(partes.length===2){
    return partes[0]*60+partes[1];
  }

  if(partes.length===3){
    return partes[0]*3600+partes[1]*60+partes[2];
  }

  return 0;
}

function obtenerStartDesdeUrl(url){

  try{

    const u=new URL(url);

    let t=u.searchParams.get("t") || u.searchParams.get("start");

    if(!t)return 0;

    if(/^\d+$/.test(t)){
      return parseInt(t);
    }

    const m=t.match(/(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?/);

    if(m){
      return (parseInt(m[1]||0)*3600)+
             (parseInt(m[2]||0)*60)+
             parseInt(m[3]||0);
    }

  }catch(e){}

  return 0;
}

function crearEmbedYouTube(url,start=0){

  const id=extraerYouTubeId(url);

  if(!id)return null;

  let src=
    "https://www.youtube.com/embed/"+
    encodeURIComponent(id)+
    "?enablejsapi=1&rel=0&modestbranding=1&playsinline=1&controls=1&disablekb=1&iv_load_policy=3";

  if(start>0){
    src+="&start="+Math.floor(start);
  }

  return src;
}

/* =========================
   CARGAR CATALOGO
========================= */

async function cargarCatalogo(){

  try{

    const r=await fetch(
      'juegos.json',
      {cache:'no-store'}
    );

    if(!r.ok)
      throw new Error('No se pudo cargar juegos.json');

    catalogo=await r.json();

    if(!Array.isArray(catalogo.juegos))
      catalogo.juegos=[];

    if(!Array.isArray(catalogo.categorias))
      catalogo.categorias=[];

    renderCategorias();
    renderJuegos();

  }catch(e){

    console.error(e);

    document.getElementById('grid').innerHTML=
      '<p style="text-align:center">'+
      'No se pudo cargar el catálogo de juegos.'+
      '</p>';
  }
}

/* =========================
   CATEGORIAS
========================= */

function renderCategorias(){

  const cont=document.getElementById('categories');

  const categorias=new Set();

  catalogo.juegos.forEach(j=>{

    if(j.categoria){
      categorias.add(j.categoria);
    }

  });

  cont.innerHTML='';

  const todas=["Todos",...Array.from(categorias)];

  todas.forEach(cat=>{

    const btn=document.createElement('button');

    btn.className=
      'category-btn '+
      (categoriaActual===cat?'active':'');

    btn.textContent=cat;

    btn.onclick=()=>{

      categoriaActual=cat;

      renderCategorias();
      aplicarFiltros();

    };

    cont.appendChild(btn);

  });

}

/* =========================
   JUEGOS
========================= */

function aplicarFiltros(){

  const texto=
    document.getElementById('searchInput')
      .value
      .trim()
      .toLowerCase();

  const filtrados=catalogo.juegos.filter(j=>{

    const coincideCategoria=
      categoriaActual==="Todos" ||
      j.categoria===categoriaActual;

    const coincideTexto=
      !texto ||
      String(j.nombre||'')
        .toLowerCase()
        .includes(texto);

    return coincideCategoria && coincideTexto;

  });

  renderJuegos(filtrados);
}

function renderJuegos(lista=null){

  const grid=document.getElementById('grid');

  grid.innerHTML='';

  const juegos=
    lista ||
    [...catalogo.juegos]
      .sort((a,b)=>
        (a.orden||0)-(b.orden||0)
      );

  if(!juegos.length){

    grid.innerHTML=
      '<p style="text-align:center;grid-column:1/-1">'+
      'No se encontraron juegos.'+
      '</p>';

    return;
  }

  juegos.forEach(j=>{

    const card=document.createElement('div');

    card.className='card';

    card.onclick=()=>abrirJuego(
      j.url,
      j.tipo,
      j.accion,
      j
    );

    const img=document.createElement('img');

    img.src=j.imagen;
    img.alt=j.nombre;

    const p=document.createElement('p');

    p.textContent=j.nombre;

    card.append(img,p);

    grid.appendChild(card);

  });

}

/* =========================
   ABRIR JUEGOS
========================= */

function abrirJuego(ruta,tipo,accion,juego=null){

  if(
    accion==='abrirEmuladorSNES' ||
    tipo==='snes'
  ){
    return abrirEmuladorSNES(ruta);
  }

  if(
    accion==='abrirEnNuevaPestana' ||
    tipo==='newtab'
  ){
    window.open(ruta,'_blank');
    return;
  }

  if(tipo==='youtube'){

    return abrirYouTube(
      ruta,
      juego?.youtubeStart || obtenerStartDesdeUrl(ruta)
    );

  }

  const target=
    document.getElementById('ruffle-target');

  target.innerHTML='';

  document.getElementById('youtube-controls')
    .style.display='none';

  if(tipo==='swf'){

    const ruffle=
      window.RufflePlayer.newest();

    currentPlayer=
      ruffle.createPlayer();

    currentPlayer.style.width='100%';
    currentPlayer.style.height='100%';

    target.appendChild(currentPlayer);

    currentPlayer.load(ruta);

  }else{

    const iframe=
      document.createElement('iframe');

    iframe.src=ruta;

    iframe.style.width='100%';
    iframe.style.height='100%';
    iframe.style.border='none';

    iframe.allowFullscreen=true;

    iframe.setAttribute(
      'allowfullscreen',
      'true'
    );

    iframe.allow=
      'fullscreen; autoplay; gamepad; pointer-lock';

    target.appendChild(iframe);

  }

  mostrarPlayer();

}

/* =========================
   YOUTUBE
========================= */

function abrirYouTube(url,start=0){

  const id=extraerYouTubeId(url);

  if(!id){

    alert(
      'No pude reconocer este enlace de YouTube.'
    );

    return;
  }

  currentYoutubeStart=start;

  const target=
    document.getElementById('ruffle-target');

  target.innerHTML='';

  const wrapper=
    document.createElement('div');

  wrapper.className='youtube-player';

  const iframe=
    document.createElement('iframe');

  iframe.className='youtube-frame';

  iframe.id='youtube-frame';

  iframe.src=
    crearEmbedYouTube(url,start);

  iframe.allow=
    'accelerometer; autoplay; clipboard-write; '+
    'encrypted-media; gyroscope; picture-in-picture; web-share';

  iframe.allowFullscreen=true;

  iframe.setAttribute(
    'allowfullscreen',
    'true'
  );

  /*
    Capa transparente que cubre TODO el iframe.
    Bloquea cualquier clic directo sobre YouTube.
  */
  const fullShield=
    document.createElement('div');

  fullShield.className='youtube-full-shield';

  /*
    Capa invisible encima de la protección.
    Un toque/clic pausa o reanuda el video.
  */
  const tapLayer=
    document.createElement('div');

  tapLayer.className='youtube-tap-layer';
  tapLayer.setAttribute('role','button');
  tapLayer.setAttribute('aria-label','Pausar o reanudar video');
  tapLayer.addEventListener('pointerup',function(event){
    event.preventDefault();
    toggleYouTubePlayPause();
  });

  /*
    Capa negra que aparece durante los últimos 3 segundos.
    Así nunca se muestra la pantalla final con
    "Más videos" ni miniaturas recomendadas.
  */
  const endShield=
    document.createElement('div');

  endShield.className=
    'youtube-end-shield';

  endShield.id='youtube-end-shield';

  wrapper.appendChild(iframe);
  wrapper.appendChild(fullShield);
  wrapper.appendChild(tapLayer);
  wrapper.appendChild(endShield);

  target.appendChild(wrapper);

  youtubeEndedByProtection=false;
  if(youtubeEndTimer){
    clearInterval(youtubeEndTimer);
    youtubeEndTimer=null;
  }

  document.getElementById('youtube-controls')
    .style.display='flex';

  mostrarPlayer();

  /*
    Creamos también la conexión API
    para nuestros botones propios.
  */

  crearYouTubePlayerAPI(id,start);

}

function crearYouTubePlayerAPI(id,start){

  let intentos=0;

  const intentar=()=>{

    intentos++;

    if(
      typeof YT==='undefined' ||
      !YT.Player
    ){

      if(intentos<30)
        setTimeout(intentar,300);

      return;
    }

    try{

      youtubePlayer=
        new YT.Player(
          'youtube-frame',
          {
            events:{
              onReady:function(event){

                youtubePlayer=event.target;

                if(start>0){
                  youtubePlayer.seekTo(
                    start,
                    true
                  );
                }

                iniciarProteccionFinYouTube();

              },

              onStateChange:function(){
                iniciarProteccionFinYouTube();
              }
            }
          }
        );

    }catch(e){
      console.log(e);
    }

  };

  intentar();
}

function iniciarProteccionFinYouTube(){

  if(youtubeEndTimer){
    clearInterval(youtubeEndTimer);
  }

  youtubeEndTimer=setInterval(
    protegerFinalYouTube,
    250
  );

}

function protegerFinalYouTube(){

  if(
    !youtubePlayer ||
    !youtubePlayer.getCurrentTime ||
    !youtubePlayer.getDuration
  ){
    return;
  }

  const actual=youtubePlayer.getCurrentTime();
  const duracion=youtubePlayer.getDuration();

  if(!duracion || duracion<=0){
    return;
  }

  const restantes=duracion-actual;

  actualizarBarraYouTube();

  const shield=
    document.getElementById('youtube-end-shield');

  if(!shield){
    return;
  }

  /*
    Tres segundos antes del final:
    pausamos el video y ponemos pantalla negra.
    Esto impide que aparezca la pantalla final
    con "Más videos", miniaturas o enlaces.
  */
  if(
    restantes<=3 &&
    restantes>=0 &&
    !youtubeEndedByProtection
  ){

    youtubeEndedByProtection=true;

    if(youtubePlayer.pauseVideo){
      youtubePlayer.pauseVideo();
    }

    shield.style.display='block';

    return;
  }

  /*
    Si el usuario retrocede manualmente con nuestros
    botones, quitamos la pantalla negra para permitir
    continuar desde ese punto.
  */
  if(restantes>3 && youtubeEndedByProtection){

    youtubeEndedByProtection=false;
    shield.style.display='none';

  }

}

function toggleYouTubePlayPause(){

  if(!youtubePlayer || !youtubePlayer.getPlayerState){
    return;
  }

  const estado=youtubePlayer.getPlayerState();

  if(estado===YT.PlayerState.PLAYING){
    youtubePause();
  }else{
    youtubePlay();
  }

}

function youtubePlay(){

  if(youtubePlayer &&
     youtubePlayer.playVideo){

    youtubePlayer.playVideo();

  }

}

function youtubePause(){

  if(youtubePlayer &&
     youtubePlayer.pauseVideo){

    youtubePlayer.pauseVideo();

  }

}

function youtubeSeek(segundos){

  if(
    youtubePlayer &&
    youtubePlayer.getCurrentTime &&
    youtubePlayer.seekTo
  ){

    const actual=
      youtubePlayer.getCurrentTime();

    const nuevoTiempo=
      Math.max(0,actual+segundos);

    youtubePlayer.seekTo(
      nuevoTiempo,
      true
    );

    if(youtubeEndedByProtection){
      const duracion=youtubePlayer.getDuration();

      if(
        duracion &&
        duracion-nuevoTiempo>3
      ){
        youtubeEndedByProtection=false;

        const shield=
          document.getElementById(
            'youtube-end-shield'
          );

        if(shield)
          shield.style.display='none';
      }
    }

  }

}

function formatarTempo(segundos){

  segundos=Math.max(0,Math.floor(Number(segundos)||0));

  const minutos=Math.floor(segundos/60);
  const secs=String(segundos%60).padStart(2,'0');

  return minutos+':'+secs;

}

function actualizarBarraYouTube(){

  if(!youtubePlayer || !youtubePlayer.getCurrentTime || !youtubePlayer.getDuration)
    return;

  const actual=youtubePlayer.getCurrentTime();
  const duracion=youtubePlayer.getDuration();

  if(!duracion || duracion<=0)
    return;

  const barra=document.getElementById('youtube-progress');
  const actualEl=document.getElementById('youtube-current-time');
  const duracionEl=document.getElementById('youtube-duration');

  if(barra && document.activeElement!==barra){
    barra.max=duracion;
    barra.value=Math.min(actual,duracion);
  }

  if(actualEl) actualEl.textContent=formatarTempo(actual);
  if(duracionEl) duracionEl.textContent=formatarTempo(duracion);

}

function youtubePreviewSeek(valor){

  const actualEl=document.getElementById('youtube-current-time');
  if(actualEl) actualEl.textContent=formatarTempo(valor);

}

function youtubeSeekTo(valor){

  if(!youtubePlayer || !youtubePlayer.seekTo)
    return;

  const nuevo=Math.max(0,Number(valor)||0);
  const duracion=youtubePlayer.getDuration();

  if(duracion && duracion-nuevo<=3){
    youtubeEndedByProtection=true;
    const shield=document.getElementById('youtube-end-shield');
    if(shield) shield.style.display='block';
    youtubePlayer.pauseVideo();
    return;
  }

  youtubeEndedByProtection=false;
  const shield=document.getElementById('youtube-end-shield');
  if(shield) shield.style.display='none';

  youtubePlayer.seekTo(nuevo,true);

}

function abrirEmuladorSNES(url){

  target.appendChild(iframe);

async function pantallaCompleta(){

  const target=
    document.getElementById('ruffle-target');

  if(!document.fullscreenElement){

    if(target.requestFullscreen)
      await target.requestFullscreen();

    else if(target.webkitRequestFullscreen)
      await target.webkitRequestFullscreen();

    else if(target.msRequestFullscreen)
      await target.msRequestFullscreen();

    try{

      if(
        screen.orientation &&
        screen.orientation.lock
      ){

        await screen.orientation.lock(
          'landscape'
        );

      }

    }catch(e){}

  }else{

    if(document.exitFullscreen)
      await document.exitFullscreen();

    else if(document.webkitExitFullscreen)
      await document.webkitExitFullscreen();

  }

}

}

function escapeHtml(s){

  return String(s??'').replace(
    /[&<>"']/g,
    m=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[m])
  );

}

function escapeAttr(s){

  return escapeHtml(s)
    .replace(/`/g,'&#96;');

}

function segundosATiempo(segundos){

  segundos=parseInt(segundos)||0;

  const h=Math.floor(segundos/3600);

  const m=Math.floor(
    (segundos%3600)/60
  );

  const s=segundos%60;

  if(h)
    return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;

  return `${m}:${String(s).padStart(2,'0')}`;

}

}

function subirJuego(id){

  const a=
    catalogo.juegos.sort(
      (x,y)=>
        (x.orden||0)-(y.orden||0)
    );

  const i=
    a.findIndex(x=>x.id===id);

  if(i>0){

    [a[i-1],a[i]]=
      [a[i],a[i-1]];

    reordenar();

    renderJuegos();
    renderAdmin();

  }

}

function bajarJuego(id){

  const a=
    catalogo.juegos.sort(
      (x,y)=>
        (x.orden||0)-(y.orden||0)
    );

  const i=
    a.findIndex(x=>x.id===id);

  if(
    i>=0 &&
    i<a.length-1
  ){

    [a[i],a[i+1]]=
      [a[i+1],a[i]];

    reordenar();

    renderJuegos();
    renderAdmin();

  }

}

function ocultarGitHub(){

}

function guardarConfigGitHub(){

  const cfg={
    owner:document.getElementById('gh-owner').value.trim(),
    repo:document.getElementById('gh-repo').value.trim(),
    path:document.getElementById('gh-path').value.trim() || 'juegos.json',
    branch:document.getElementById('gh-branch').value.trim() || 'main',
    token:document.getElementById('gh-token').value.trim()
  };

  if(!cfg.owner || !cfg.repo || !cfg.token){
    document.getElementById('github-status').textContent=
      'Completa usuario, repositorio y token.';
    return;
  }

  localStorage.setItem(
    'freshmind_github_config',
    JSON.stringify(cfg)
  );

  document.getElementById('github-status').textContent=
    'Configuración guardada en este navegador.';

}

function textoBase64UTF8(texto){
  const bytes=new TextEncoder().encode(texto);
  let bin='';
  const bloque=0x8000;

  for(let i=0;i<bytes.length;i+=bloque){
    bin+=String.fromCharCode(...bytes.subarray(i,i+bloque));
  }

  return btoa(bin);
}

async function actualizarGitHub(){

  const status=document.getElementById('github-status');

  const cfg={
    owner:document.getElementById('gh-owner').value.trim(),
    repo:document.getElementById('gh-repo').value.trim(),
    path:document.getElementById('gh-path').value.trim() || 'juegos.json',
    branch:document.getElementById('gh-branch').value.trim() || 'main',
    token:document.getElementById('gh-token').value.trim()
  };

  if(!cfg.owner || !cfg.repo || !cfg.token){
    status.textContent='Falta usuario, repositorio o token.';
    return;
  }

  guardarConfigGitHub();
  reordenar();

  const contenido=JSON.stringify(catalogo,null,2);
  const apiUrl=
    'https://api.github.com/repos/'+
    encodeURIComponent(cfg.owner)+'/'+
    encodeURIComponent(cfg.repo)+'/contents/'+
    cfg.path.split('/').map(encodeURIComponent).join('/');

  status.textContent='⏳ Conectando con GitHub...';

  try{

    const headers={
      'Accept':'application/vnd.github+json',
      'Authorization':'Bearer '+cfg.token,
      'X-GitHub-Api-Version':'2022-11-28'
    };

    let sha=null;

    const getResponse=await fetch(
      apiUrl+'?ref='+encodeURIComponent(cfg.branch),
      {headers}
    );

    if(getResponse.ok){
      const actual=await getResponse.json();
      sha=actual.sha;
    }else if(getResponse.status!==404){
      const error=await getResponse.json().catch(()=>({}));
      throw new Error(error.message || 'No se pudo leer juegos.json en GitHub.');
    }

    const body={
      message:'Actualizar juegos.json desde FreshMind Games',
      content:textoBase64UTF8(contenido),
      branch:cfg.branch
    };

    if(sha) body.sha=sha;

    const putResponse=await fetch(
      apiUrl,
      {
        method:'PUT',
        headers:{
          ...headers,
          'Content-Type':'application/json'
        },
        body:JSON.stringify(body)
      }
    );

    const result=await putResponse.json().catch(()=>({}));

    if(!putResponse.ok){
      throw new Error(
        result.message ||
        'GitHub rechazó la actualización.'
      );
    }

    status.textContent='✅ juegos.json actualizado en GitHub.';

  }catch(error){

    console.error('Error actualizando GitHub:',error);
    status.textContent='❌ '+error.message;

  }

}

function exportarJSON(){

  reordenar();

  const blob=
    new Blob(
      [
        JSON.stringify(
          catalogo,
          null,
          2
        )
      ],
      {
        type:'application/json'
      }
    );

  const a=
    document.createElement('a');

  a.href=
    URL.createObjectURL(blob);

  a.download='juegos.json';

  a.click();

  URL.revokeObjectURL(a.href);

}

function importarJSON(){

  document.getElementById(
    'jsonFile'
  ).click();

}

function leerJSON(ev){

  const f=
    ev.target.files[0];

  if(!f)return;

  const r=
    new FileReader();

  r.onload=()=>{

    try{

      const data=
        JSON.parse(r.result);

      if(!Array.isArray(data.juegos))
        throw new Error();

      catalogo=data;

      if(!Array.isArray(catalogo.categorias))
        catalogo.categorias=[];

      renderCategorias();
      renderJuegos();
      renderAdmin();

      alert(
        'Catálogo cargado correctamente.'
      );

    }catch(e){

      alert(
        'JSON no válido.'
      );

    }

  };

  r.readAsText(f);

  ev.target.value='';

}
